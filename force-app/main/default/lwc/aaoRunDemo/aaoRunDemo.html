<template>
    <lightning-card title="Run the pass on this deal" icon-name="standard:einstein_replies">
        <div class="slds-p-horizontal_medium">

            <!-- THE PASTE SURFACE. Componentized deliberately: this block and the run view
                 below share nothing but the controller, so either lifts out standalone. -->
            <template if:false={runKey}>
                <lightning-input
                    label="What was this? (optional)"
                    placeholder="Discovery call, 16 August"
                    value={label}
                    onchange={handleLabel}
                    class="slds-m-bottom_x-small"
                ></lightning-input>
                <lightning-textarea
                    label="Who was on the call? (key, Display Name, email — one per line)"
                    placeholder="marcus, Marcus Reyes, marcus.reyes@northbank.example"
                    value={roster}
                    onchange={handleRoster}
                    class="slds-m-bottom_x-small"
                ></lightning-textarea>
                <lightning-textarea
                    label="Paste the transcript, note or email"
                    placeholder="speaker&#9;their words..."
                    value={text}
                    onchange={handleText}
                    class="slds-m-bottom_small"
                ></lightning-textarea>
                <lightning-button
                    variant="brand"
                    label="Run the pass"
                    disabled={cannotRun}
                    onclick={handleRun}
                ></lightning-button>
                <p class="slds-text-body_small slds-m-top_x-small slds-text-color_weak">
                    The pass reads what is here and establishes only what the words carry.
                    Every stage below is drawn from what the run journalled, never estimated.
                </p>

                <!-- EARLIER RUNS. The form stays the default after a refresh, because that is
                     what someone arriving wants; the past is a click away rather than gone. -->
                <template if:true={hasPast}>
                    <div class="slds-m-top_small">
                        <lightning-button
                            variant="base"
                            label={pastLabel}
                            onclick={handleTogglePast}
                        ></lightning-button>
                        <template if:true={showingPast}>
                            <div class="slds-m-top_x-small">
                                <template for:each={pastRows} for:item="r">
                                    <div key={r.runKey} class={r.css}
                                         data-key={r.runKey} onclick={handleOpenPast}>
                                        <span class="past-ord">{r.ordinal}</span>
                                        <span class="past-when">{r.when}</span>
                                        <span class="past-status">{r.status}</span>
                                    </div>
                                </template>
                            </div>
                        </template>
                    </div>
                </template>
            </template>

            <template if:true={error}>
                <div class="slds-box slds-theme_error slds-m-vertical_small">{error}</div>
            </template>

            <!-- THE RUN VIEW -->
            <template if:true={runKey}>
                <!-- NO OVERLAY SPINNER. `lightning-spinner` covers its whole container and
                     greys what is behind it, which on this surface means it hides the stage
                     list it is reporting on - the one thing the viewer is here to watch.
                     THE STAGE LIST IS THE PROGRESS INDICATOR; this is just a live pip. -->
                <div class="runhead">
                    <lightning-button
                        variant="base"
                        label="New run"
                        onclick={handleNewRun}
                    ></lightning-button>
                    <span class="slds-text-title_caps">{runKey}</span>
                    <template if:true={running}>
                        <span class="pip">running</span>
                    </template>
                </div>


                <!-- THE PROCESS BAR. Eight steps, laid out as a row of cells with a
                     connector between them, so a viewer sees WHERE the run is at a glance and
                     the detail underneath answers HOW LONG. The running step animates; nothing
                     else moves, because nothing else is happening. -->
                <div class="steps">
                    <template for:each={stageRows} for:item="s">
                        <div key={s.key} class={s.css}>
                            <div class="dot"><span class="dotnum">{s.num}</span></div>
                            <div class="steplabel">{s.label}</div>
                            <div class="stepdetail">{s.detail}</div>
                        </div>
                    </template>
                </div>

                <!-- GUARDED ON `view`, NOT ON `runKey`. They resolve independently: runKey is
                     set the instant the run starts, and view does not exist until the first
                     poll returns, so anything reading view.* in that gap throws and freezes
                     the component. This is the sixty-fourth stamp's Inspector defect exactly,
                     in the same component family, and it is why the guard is on the thing
                     being read rather than on the thing that looks ready. -->
                <template if:true={view}>
                    <template if:true={view.stoppedBecause}>
                        <div class="slds-box slds-theme_warning slds-m-bottom_small">
                            <p><strong>The pass stopped.</strong> {view.stoppedBecause}</p>
                            <p class="slds-text-body_small slds-m-top_x-small">
                                Everything before this stage is banked. Resuming picks up there
                                and does not repeat work already done.
                            </p>
                            <lightning-button
                                variant="brand"
                                label="Resume the run"
                                disabled={resuming}
                                onclick={handleResume}
                                class="slds-m-top_x-small"
                            ></lightning-button>
                        </div>
                    </template>
                </template>

                <template if:true={view}>
                    <div class="slds-m-top_small slds-text-body_small">
                        <strong>{wallSeconds}s</strong> journalled across
                        <strong>{view.callouts}</strong> callouts
                        <template if:true={view.cacheState}> · {view.cacheState}</template>
                    </div>
                </template>
                <template if:true={worstCalloutLine}>
                    <div class="slds-text-body_small slds-text-color_weak">{worstCalloutLine}</div>
                </template>

                <div class="slds-m-top_medium">
                    <template for:each={ledgerRows} for:item="r">
                        <div key={r.key} class="ledger-row">
                            <span class="ledger-value">{r.value}</span>
                            <span class="ledger-label">{r.label}</span>
                        </div>
                    </template>
                </div>
            </template>
            <!-- ================================================= THE PROCESS PANEL · (f)
                 Below the run, not inside it. The run view is about a RUN; this is about the
                 DEAL, the same distinction the map and the board already carry by having no run
                 key at all. Guarded on `process` rather than on anything that looks ready, per
                 the sixty-fourth stamp's defect in this very component. -->
            <template if:true={process}>
                <div class="slds-border_top slds-m-top_medium slds-p-top_small">
                    <div class="proc-head">
                        <span class="proc-title">Process</span>
                        <span class="proc-stage">{process.stageLine}</span>
                        <template if:true={hasReds}>
                            <span class="proc-reds">{process.redCount} red</span>
                        </template>
                    </div>

                    <div class="slds-m-top_x-small">
                        <template for:each={process.assessment} for:item="a">
                            <div key={a.code} class={a.css}>
                                <div class="aaoq">{a.question}</div>
                                <div class="aaostate">
                                    <template if:true={a.display}>{a.display}</template>
                                </div>
                                <template if:true={a.citation}>
                                    <div class="aaocite">{a.citation}</div>
                                </template>
                                <template if:true={a.because}>
                                    <div class="aaowhy">{a.because}</div>
                                </template>
                            </div>
                        </template>
                    </div>

                    <template if:true={hasGhosts}>
                        <div class="slds-m-top_small">
                            <div class="proc-sub">Personas this stage expects and nobody fills</div>
                            <template for:each={process.ghosts} for:item="g">
                                <div key={g.persona} class="aaorow aaoghost">
                                    <div class="aaoq">{g.persona}</div>
                                    <div class="aaowhy">{g.because}</div>
                                </div>
                            </template>
                        </div>
                    </template>

                    <template if:true={hasQualifiers}>
                        <div class="slds-m-top_small">
                            <div class="proc-sub">Qualifiers</div>
                            <template for:each={process.qualifiers} for:item="q">
                                <div key={q.name} class="aaorow aaoqual">
                                    <div class="aaoq">{q.question}</div>
                                    <div class="aaowhy">{q.plane} &middot; {q.state}</div>
                                </div>
                            </template>
                        </div>
                    </template>

                    <div class="slds-m-top_small proc-counts">
                        <template for:each={process.counts} for:item="c">
                            <span key={c.label} class="proc-count">
                                <strong>{c.value}</strong> {c.label}
                            </span>
                        </template>
                    </div>

                    <template if:true={hasProcessNotes}>
                        <div class="slds-m-top_x-small proc-notes">
                            <template for:each={process.notes} for:item="n">
                                <div key={n.key} class="proc-note">{n.text}</div>
                            </template>
                        </div>
                    </template>
                </div>
            </template>

            <!-- PURGE, at the bottom and behind a confirm, so a demo resets in one place
                 without anyone opening Execute Anonymous in the room. -->
            <div class="slds-border_top slds-m-top_medium slds-p-top_small">
                <template if:false={confirmingPurge}>
                    <lightning-button
                        variant="destructive-text"
                        label="Purge this deal"
                        onclick={handlePurgeAsk}
                    ></lightning-button>
                </template>
                <template if:true={confirmingPurge}>
                    <div class="slds-box slds-theme_warning">
                        <p class="slds-m-bottom_x-small">
                            Delete every run, claim, answer, card and projected value this
                            pipeline wrote on <strong>this opportunity</strong>? Seeded records
                            and anything a human edited are kept.
                        </p>
                        <lightning-button
                            variant="destructive"
                            label="Yes, purge it"
                            disabled={purging}
                            onclick={handlePurgeConfirm}
                            class="slds-m-right_x-small"
                        ></lightning-button>
                        <lightning-button
                            label="Cancel"
                            disabled={purging}
                            onclick={handlePurgeCancel}
                        ></lightning-button>
                    </div>
                </template>
            </div>
        </div>
    </lightning-card>
</template>
