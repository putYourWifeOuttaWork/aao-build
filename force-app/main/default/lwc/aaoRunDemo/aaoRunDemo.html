<template>
    <lightning-card title="Run the pass on this deal" icon-name="standard:einstein_replies">
        <div class="slds-p-horizontal_medium">

            <!-- THE PASTE SURFACE. Componentized deliberately: this block and the run view
                 below share nothing but the controller, so either lifts out standalone. -->
            <template if:false={runKey}>
                <lightning-input
                    label="What was this? (optional)"
                    placeholder="Discovery call, 16 August"
                    value={label}
                    onchange={handleLabel}
                    class="slds-m-bottom_x-small"
                ></lightning-input>
                <lightning-textarea
                    label="Who was on the call? (key, Display Name, email — one per line)"
                    placeholder="marcus, Marcus Reyes, marcus.reyes@northbank.example"
                    value={roster}
                    onchange={handleRoster}
                    class="slds-m-bottom_x-small"
                ></lightning-textarea>
                <lightning-textarea
                    label="Paste the transcript, note or email"
                    placeholder="speaker&#9;their words..."
                    value={text}
                    onchange={handleText}
                    class="slds-m-bottom_small"
                ></lightning-textarea>
                <lightning-button
                    variant="brand"
                    label="Run the pass"
                    disabled={cannotRun}
                    onclick={handleRun}
                ></lightning-button>
                <p class="slds-text-body_small slds-m-top_x-small slds-text-color_weak">
                    The pass reads what is here and establishes only what the words carry.
                    Every stage below is drawn from what the run journalled, never estimated.
                </p>
            </template>

            <template if:true={error}>
                <div class="slds-box slds-theme_error slds-m-vertical_small">{error}</div>
            </template>

            <!-- THE RUN VIEW -->
            <template if:true={runKey}>
                <!-- NO OVERLAY SPINNER. `lightning-spinner` covers its whole container and
                     greys what is behind it, which on this surface means it hides the stage
                     list it is reporting on - the one thing the viewer is here to watch.
                     THE STAGE LIST IS THE PROGRESS INDICATOR; this is just a live pip. -->
                <div class="runhead">
                    <span class="slds-text-title_caps">{runKey}</span>
                    <template if:true={running}>
                        <span class="pip">running</span>
                    </template>
                </div>

                <!-- GUARDED ON `view`, NOT ON `runKey`. They resolve independently: runKey is
                     set the instant the run starts, and view does not exist until the first
                     poll returns, so anything reading view.* in that gap throws and freezes
                     the component. This is the sixty-fourth stamp's Inspector defect exactly,
                     in the same component family, and it is why the guard is on the thing
                     being read rather than on the thing that looks ready. -->
                <template if:true={view}>
                    <template if:true={view.stoppedBecause}>
                        <div class="slds-box slds-theme_warning slds-m-bottom_small">
                            <strong>The pass stopped.</strong> {view.stoppedBecause}
                        </div>
                    </template>
                </template>

                <!-- THE PROCESS BAR. Eight steps, laid out as a row of cells with a
                     connector between them, so a viewer sees WHERE the run is at a glance and
                     the detail underneath answers HOW LONG. The running step animates; nothing
                     else moves, because nothing else is happening. -->
                <div class="steps">
                    <template for:each={stageRows} for:item="s">
                        <div key={s.key} class={s.css}>
                            <div class="dot"><span class="dotnum">{s.num}</span></div>
                            <div class="steplabel">{s.label}</div>
                            <div class="stepdetail">{s.detail}</div>
                        </div>
                    </template>
                </div>

                <!-- GUARDED ON `view`, NOT ON `runKey`. They resolve independently: runKey is
                     set the instant the run starts, and view does not exist until the first
                     poll returns, so anything reading view.* in that gap throws and freezes
                     the component. This is the sixty-fourth stamp's Inspector defect exactly,
                     in the same component family, and it is why the guard is on the thing
                     being read rather than on the thing that looks ready. -->
                <template if:true={view}>
                    <template if:true={view.stoppedBecause}>
                        <div class="slds-box slds-theme_warning slds-m-bottom_small">
                            <strong>The pass stopped.</strong> {view.stoppedBecause}
                        </div>
                    </template>
                </template>

                <div class="stages">
                <template for:each={stageRows} for:item="s">
                    <div key={s.key} class={s.css}>
                        <span class="stage-name">{s.name}</span>
                        <span class="stage-state">{s.state}</span>
                        <span class="stage-detail">{s.detail}</span>
                    </div>
                </template>
                </div>

                <template if:true={view}>
                    <div class="slds-m-top_small slds-text-body_small">
                        <strong>{wallSeconds}s</strong> journalled across
                        <strong>{view.callouts}</strong> callouts
                        <template if:true={view.cacheState}> · {view.cacheState}</template>
                    </div>
                </template>
                <template if:true={worstCalloutLine}>
                    <div class="slds-text-body_small slds-text-color_weak">{worstCalloutLine}</div>
                </template>

                <div class="slds-m-top_medium">
                    <template for:each={ledgerRows} for:item="r">
                        <div key={r.key} class="ledger-row">
                            <span class="ledger-value">{r.value}</span>
                            <span class="ledger-label">{r.label}</span>
                        </div>
                    </template>
                </div>
            </template>
            <!-- PURGE, at the bottom and behind a confirm, so a demo resets in one place
                 without anyone opening Execute Anonymous in the room. -->
            <div class="slds-border_top slds-m-top_medium slds-p-top_small">
                <template if:false={confirmingPurge}>
                    <lightning-button
                        variant="destructive-text"
                        label="Purge this deal"
                        onclick={handlePurgeAsk}
                    ></lightning-button>
                </template>
                <template if:true={confirmingPurge}>
                    <div class="slds-box slds-theme_warning">
                        <p class="slds-m-bottom_x-small">
                            Delete every run, claim, answer, card and projected value this
                            pipeline wrote on <strong>this opportunity</strong>? Seeded records
                            and anything a human edited are kept.
                        </p>
                        <lightning-button
                            variant="destructive"
                            label="Yes, purge it"
                            disabled={purging}
                            onclick={handlePurgeConfirm}
                            class="slds-m-right_x-small"
                        ></lightning-button>
                        <lightning-button
                            label="Cancel"
                            disabled={purging}
                            onclick={handlePurgeCancel}
                        ></lightning-button>
                    </div>
                </template>
            </div>
        </div>
    </lightning-card>
</template>
